<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>个人项目 · Kokomi</title>
<meta name="description" content="Kokomi 的个人项目：论文阅读、多模态检测、写作工具与视觉分析。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23111311'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%2343b987'/%3E%3C/svg%3E">
<script>
(() => {
  try {
    const saved = localStorage.getItem('portal-theme');
    const systemTheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.dataset.theme = saved || systemTheme;
  } catch {
    document.documentElement.dataset.theme = 'dark';
  }
})();
</script>
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<div class="mesh"></div>

<div class="nav">
  <div class="nav-inner">
    <span class="brand"><i class="mark"></i><b id="navOwner">Kokomi</b></span>
    <span class="nav-sep"></span>
    <a class="navlink" href="#services">项目</a>
    <a class="navlink" id="navGithub" href="https://github.com/Kokomi-BC" target="_blank" rel="noopener noreferrer">
      <svg class="gh-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 .3a12 12 0 0 0-3.8 23.4c.6.1.8-.3.8-.6v-2c-3.3.7-4-1.6-4-1.6-.6-1.4-1.4-1.8-1.4-1.8-1.1-.8.1-.7.1-.7 1.2.1 1.9 1.2 1.9 1.2 1.1 1.8 2.8 1.3 3.5 1 .1-.8.4-1.3.8-1.6-2.7-.3-5.5-1.3-5.5-5.9 0-1.3.5-2.4 1.2-3.2-.1-.3-.5-1.5.1-3.2 0 0 1-.3 3.3 1.2a11.5 11.5 0 0 1 6 0C17.3 4.7 18.3 5 18.3 5c.7 1.7.3 2.9.1 3.2a4.6 4.6 0 0 1 1.2 3.2c0 4.6-2.8 5.6-5.5 5.9.4.4.8 1.1.8 2.2v3.3c0 .3.2.7.8.6A12 12 0 0 0 12 .3Z"/></svg>
      <span>GitHub</span><span class="ic" aria-hidden="true">↗</span>
    </a>
    <button class="navlink theme-toggle" id="themeToggle" type="button" aria-label="切换页面主题" aria-pressed="false" title="切换页面主题">
      <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.8"></circle><path d="M12 2.5v2.1M12 19.4v2.1M4.8 4.8l1.5 1.5M17.7 17.7l1.5 1.5M2.5 12h2.1M19.4 12h2.1M4.8 19.2l1.5-1.5M17.7 6.3l1.5-1.5"></path></svg>
      <svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.2 15.2A8.4 8.4 0 0 1 8.8 3.8 8.5 8.5 0 1 0 20.2 15.2Z"></path></svg>
      <span class="theme-label">主题</span>
    </button>
    <a class="navlink" id="adminEntry" href="/admin" hidden>管理入口</a>
    <b class="nav-clock" id="clock">--:--:--</b>
  </div>
</div>

<div class="wrap">
  <header class="hero reveal">
    <span class="eyebrow"><i class="dot" id="heroDot"></i><span id="eyebrow">Personal Projects</span></span>
    <h1 id="heroTitle">个人项目</h1>
    <p class="lede" id="heroLede">这里记录了一些自己动手完成的项目。</p>

    <div class="hero-id">
      <span class="hero-school" id="heroSchool">湖南工业大学 · 个人开发项目</span>
      <a class="gh-btn" id="heroGithub" href="https://github.com/Kokomi-BC" target="_blank" rel="noopener noreferrer">
        <svg class="gh-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 .3a12 12 0 0 0-3.8 23.4c.6.1.8-.3.8-.6v-2c-3.3.7-4-1.6-4-1.6-.6-1.4-1.4-1.8-1.4-1.8-1.1-.8.1-.7.1-.7 1.2.1 1.9 1.2 1.9 1.2 1.1 1.8 2.8 1.3 3.5 1 .1-.8.4-1.3.8-1.6-2.7-.3-5.5-1.3-5.5-5.9 0-1.3.5-2.4 1.2-3.2-.1-.3-.5-1.5.1-3.2 0 0 1-.3 3.3 1.2a11.5 11.5 0 0 1 6 0C17.3 4.7 18.3 5 18.3 5c.7 1.7.3 2.9.1 3.2a4.6 4.6 0 0 1 1.2 3.2c0 4.6-2.8 5.6-5.5 5.9.4.4.8 1.1.8 2.2v3.3c0 .3.2.7.8.6A12 12 0 0 0 12 .3Z"/></svg>
        <span>GitHub</span><span class="ic" aria-hidden="true">↗</span>
      </a>
    </div>

    <div class="meta-row">
      <div>在线<b id="statUp">—</b></div>
      <div>项目数<b id="statTotal">—</b></div>
      <div>平均响应<b id="statLat">—</b></div>
    </div>
  </header>

  <main class="bento" id="services"></main>

  <footer class="foot">
    <span>nginx 1.24 · PM2 6.0.14 · Node 25 / Python 3.12</span>
    <span id="footStamp"></span>
  </footer>
</div>

<div class="toast" id="toast"></div>

<script>
const $ = (s) => document.querySelector(s);
const GITHUB_FALLBACK = 'https://github.com/Kokomi-BC';

function setupThemeToggle() {
  const button = $('#themeToggle');
  if (!button) return;

  const applyTheme = (theme, save = false) => {
    const normalized = theme === 'light' ? 'light' : 'dark';
    document.documentElement.dataset.theme = normalized;
    const isDark = normalized === 'dark';
    button.setAttribute('aria-pressed', String(isDark));
    button.setAttribute('aria-label', isDark ? '当前深色模式，点击切换浅色模式' : '当前浅色模式，点击切换深色模式');
    button.title = isDark ? '切换到浅色模式' : '切换到深色模式';
    if (save) {
      try { localStorage.setItem('portal-theme', normalized); } catch { /* 浏览器禁用存储时仍可切换 */ }
    }
  };

  applyTheme(document.documentElement.dataset.theme || 'dark');
  button.addEventListener('click', () => {
    applyTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark', true);
  });

  const media = window.matchMedia?.('(prefers-color-scheme: dark)');
  if (media?.addEventListener) {
    media.addEventListener('change', (event) => {
      try {
        if (!localStorage.getItem('portal-theme')) applyTheme(event.matches ? 'dark' : 'light');
      } catch { /* 无法读取本地存储时不覆盖用户当前选择 */ }
    });
  }
}

setupThemeToggle();

function toast(msg, err) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.toggle('err', !!err);
  t.classList.add('show');
  clearTimeout(t._h);
  t._h = setTimeout(() => t.classList.remove('show'), 2600);
}

/* ---------- 管理员判定：复用 Detect 的 JWT 登录态 ---------- */
async function whoami() {
  try {
    const r = await fetch('/auth/me', { credentials: 'include' });
    if (!r.ok) return null;
    const j = await r.json();
    return j.user || null;
  } catch { return null; }
}

/* ---------- 在线探测 ---------- */
async function probe(url) {
  const t0 = performance.now();
  try {
    const ctl = new AbortController();
    const timer = setTimeout(() => ctl.abort(), 6000);
    const r = await fetch(url, { credentials: 'include', cache: 'no-store', signal: ctl.signal });
    clearTimeout(timer);
    return { ok: r.status < 400 || r.status === 401 || r.status === 403, status: r.status, ms: Math.round(performance.now() - t0) };
  } catch {
    return { ok: false, status: 0, ms: Math.round(performance.now() - t0) };
  }
}

/* ---------- 卡片 ----------
   层级：编号/状态 → 项目名 → 简介 → 分类 · 路径 · 跳转按钮。
   项目名、简介、分类、跳转地址全部来自 links.json —— 这里不写死任何项目。 */
function card(link, i) {
  const el = document.createElement('div');
  el.className = 'shell reveal';
  el.style.transitionDelay = `${i * 60}ms`;
  el.innerHTML = `
    <a class="core" href="${link.href}">
      <div class="core-top">
        <span class="idx">${String(i + 1).padStart(2, '0')}</span>
        <span class="status"><i class="dot"></i><span class="ms">检测中</span></span>
      </div>
      <h2>${link.name}</h2>
      <p>${link.desc || ''}</p>
      <div class="core-foot">
        <span class="foot-meta">
          <span class="svc-tag">${link.tag || 'Service'}</span>
          <span class="host">${link.href}</span>
        </span>
        <span class="pill">进入<span class="ic" aria-hidden="true">↗</span></span>
      </div>
    </a>`;
  return el;
}

/* ---------- 入场 ---------- */
const io = new IntersectionObserver((es) => {
  for (const e of es) if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); }
}, { rootMargin: '0px 0px -8% 0px', threshold: .06 });
function watch(el) { io.observe(el); }

function tick() {
  $('#clock').textContent = new Date().toLocaleTimeString('zh-CN', { hour12: false });
}

(async function main() {
  tick(); setInterval(tick, 1000);
  $('#footStamp').textContent = '渲染于 ' + new Date().toLocaleString('zh-CN', { hour12: false });

  const me = await whoami();
  if (me && me.role === 'admin') {
    const entry = $('#adminEntry');
    entry.hidden = false;
    entry.textContent = '管理入口';
    entry.title = `管理入口 · ${me.username}`;
  }

  let data;
  try {
    const r = await fetch('links.json', { cache: 'no-store' });
    data = await r.json();
  } catch {
    toast('无法读取 links.json', true);
    return;
  }

  const b = data.brand || {};
  if (b.name) $('#heroTitle').textContent = b.name;
  if (b.eyebrow) $('#eyebrow').textContent = b.eyebrow;
  if (b.tagline) $('#heroLede').textContent = b.tagline;
  if (b.handle) $('#navOwner').textContent = b.handle;
  if (b.school) $('#heroSchool').textContent = b.school;
  const gh = typeof b.github === 'string' && /^https:\/\/github\.com\//.test(b.github) ? b.github : GITHUB_FALLBACK;
  $('#navGithub').href = gh;
  $('#heroGithub').href = gh;
  document.title = b.name ? `${b.name} · ${b.handle || 'Kokomi'}` : '个人项目 · Kokomi';

  const links = data.links || [];
  $('#statTotal').textContent = links.length;

  const host = $('#services');
  const nodes = links.map((l, i) => { const n = card(l, i); host.appendChild(n); return n; });
  nodes.forEach(watch);
  watch($('.hero'));

  const results = await Promise.all(links.map((l) => probe(l.probe || l.href)));
  let up = 0, latSum = 0, latN = 0;
  results.forEach((res, i) => {
    const node = nodes[i];
    const dot = node.querySelector('.dot');
    const ms = node.querySelector('.ms');
    dot.classList.add(res.ok ? 'up' : 'down');
    ms.textContent = res.ok ? `${res.ms} ms` : (res.status ? `HTTP ${res.status}` : '不可达');
    if (res.ok) { up++; latSum += res.ms; latN++; }
  });
  $('#statUp').textContent = `${up}/${links.length}`;
  $('#statLat').textContent = latN ? `${Math.round(latSum / latN)} ms` : '—';
  $('#heroDot').classList.add(up === links.length ? 'up' : (up ? 'up' : 'down'));
})();
</script>
</body>
</html>
