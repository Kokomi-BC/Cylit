# ============================================================================
#  Cylit 论文阅读与知识管理系统 —— 反向代理到 127.0.0.1:8710
#
#  路径是 /cylit/：与 `frontend/vite.config.ts` 的 `base`、`backend/main.py` 的
#  `UI_BASE` 三处逐字一致（2026-10-15 由 /app/ 改过来，用项目名更清楚）。
#  改这里就必须同时改那两处并重新构建前端，否则浏览器会去根路径拿 assets。
#
#  前缀冲突检查（已核对 /root/Detect/src/app.js）：
#    /cylit/    Detect 无此路由 → 安全
#    /api/v1/   Detect 只有 /api/（Express），nginx 最长前缀 /api/v1/ 优先生效 → 安全
#    /papers/   Detect 无此路由 → 安全
#
#  ---- 访问控制（用户口径 2026-10-15：「进入 cylit 需要登录 cookie」）----
#  三个入口（页面 / REST+SSE / 论文静态资源）**全部**要登录 —— 只锁页面等于没锁：
#  API 与 PDF 仍然裸奔，绕过去照样能读。
#
#  校验**不用**全站那套 `if ($cookie_token = "")`：它只判断 cookie **存不存在**，
#  值可以随手伪造（`document.cookie='token=x'` 就进去了）。这里走 `auth_request` 问
#  Detect 的 `/auth/nginx/user` —— 它会**验签 JWT** 并核对 `users.token_version`
#  （单点登录用的那一列），有效回 204、无效回 401。该端点本来就是给 nginx
#  `auth_request` 写的（`src/routes/auth.js` 的注释里写着）。
#
#  ⚠️ 页面回 302 去登录页；**接口与静态资源回 401 JSON** —— 不能把登录页的 HTML
#  塞给 XHR，前端只会得到一段解析不了的 HTML，报错也说不清是"没登录"。
#  401 的信封与后端 `api/response.py` 的 `{data,error,trace_id,message}` 保持一致。
# ============================================================================

# 内部子请求：只对 nginx 可见（`internal`），不对外暴露。
# 不转发请求体（鉴权用不上），但要带上原请求的 Cookie（nginx 默认会带）。
location = /__cylit_auth {
    internal;
    proxy_pass http://127.0.0.1:3000/auth/nginx/user;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Original-URI $request_uri;
}

# 未登录：页面 → 去登录页
location @cylit_login { return 302 /Login; }

# 未登录：接口 / 论文资源 → 401，信封与后端一致
location @cylit_unauthorized {
    default_type application/json;
    return 401 '{"data":null,"error":{"code":"UNAUTHORIZED","message":"未登录或登录已过期"},"trace_id":"","message":null}';
}

location = /cylit { return 301 /cylit/; }

location /cylit/ {
    auth_request /__cylit_auth;
    error_page 401 = @cylit_login;

    proxy_pass http://127.0.0.1:8710;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
}

# 老路径留一年 301：书签、别人发过的链接、浏览器里存着的深链都还能用。
# 用 rewrite 是因为 `return` 拿不到正则分组，`$request_uri` 本身带着 /app/ 前缀，
# 直接拼会得到 /cylit//app/xxx。
location = /app { return 301 /cylit/; }
location /app/ { rewrite ^/app/(.*)$ /cylit/$1 permanent; }

# REST + SSE。SSE 必须关 buffering，否则前端事件是"攒一波再吐"。
location /api/v1/ {
    auth_request /__cylit_auth;
    error_page 401 = @cylit_unauthorized;

    proxy_pass http://127.0.0.1:8710;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_connect_timeout 60s;
    proxy_send_timeout 3600s;
    proxy_read_timeout 3600s;
    chunked_transfer_encoding on;
}

# 论文静态资源：页图 / 裁图 / PDF（整目录 20~200MB，直接给 nginx 有缓存）
location /papers/ {
    auth_request /__cylit_auth;
    error_page 401 = @cylit_unauthorized;

    proxy_pass http://127.0.0.1:8710;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
}
