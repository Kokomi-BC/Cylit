# ============================================================================
#  服务门户 —— /Portal 首页 + /Portal/admin.html 管理台
#  由 /etc/nginx/sites-available/detect.conf 的 443 server 块 include 进来。
#  放在 detect.conf 的 `location / { proxy_pass :3000 }` **之前**，
#  否则前缀 /Portal/ 会被 location / 吃掉（nginx 取最长前缀，顺序不影响，
#  但人读起来更清楚，也和 Detect 自己的写法一致）。
# ============================================================================

location = /Portal { return 301 /Portal/; }

# 静态资源（字体 / css / js）
location /Portal/assets/ {
    alias /var/www/portal/assets/;
    expires 7d;
    add_header Cache-Control "public";
    try_files $uri =404;
}
location /Portal/font/ {
    alias /var/www/portal/font/;
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
}

# 管理 API：cookie 存在性由 nginx 把关，**角色**由 portal-api 问 Detect 的
# /auth/nginx/admin 判定（204 = 管理员）。
location /Portal/api/ {
    if ($cookie_token = "") { return 302 /Login; }
    proxy_pass http://127.0.0.1:3090/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
}

# 管理台页面：未登录先去登录；登录了但不是管理员由页面自己显示 403 面板
location = /Portal/admin.html {
    if ($cookie_token = "") { return 302 /Login; }
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    alias /var/www/portal/admin.html;
    default_type text/html;
}

# 首页本身公开
location /Portal/ {
    alias /var/www/portal/;
    index index.html;
    add_header Cache-Control "no-cache" always;
}
