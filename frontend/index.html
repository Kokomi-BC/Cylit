<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cylit · 智能论文阅读</title>
<meta name="description" content="Cylit：本地论文解析、逐页中英翻译、对照阅读与知识库检索工具。" />
<meta name="color-scheme" content="light dark" />
<meta name="theme-color" content="#f2f4f5" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#1a1e20" media="(prefers-color-scheme: dark)" />
<meta property="og:title" content="Cylit · 智能论文阅读" />
<meta property="og:description" content="本地论文解析、逐页中英翻译、对照阅读与知识库检索。" />
<meta property="og:type" content="website" />
<!-- 站点图标：`public/icon.png`（由仓库根的 icon.png 裁成 Apple 应用图标那种**连续圆角**曲率，
     四角透明）。路径带 `/cylit/` —— 构建产物由后端托管在 `/cylit/` 下，写 `/icon.png` 会 404。 -->
<link rel="icon" type="image/png" href="/cylit/icon.png" />
<link rel="apple-touch-icon" href="/cylit/icon.png" />
<style>
  /* 首屏内联样式：JS 还没跑起来之前也要和成品观感一致。
     颜色刻意与 src/styles/tokens.css 的第一套皮肤对齐（--bg / --text / --accent），
     深色用同一组令牌的深色值 —— 首屏因此不会"白闪一下再变黑"。 */
  :root { color-scheme: light dark; }
  html, body { margin: 0; height: 100%; }
  body {
    background: #f2f4f5; color: #171b1d;
    font: 14px/1.55 "Segoe UI Variable Text", "Segoe UI", "Microsoft YaHei UI",
          "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .boot {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    height: 100vh; gap: 18px;
  }
  /* 品牌图 PNG 自带连续圆角 + 透明四角：不要再叠 CSS 圆角（会切掉曲率）。
     尺寸给到 72：那张插画是浅色线稿，缩到 40 出头就只剩一团白雾，认不出是谁。 */
  .boot-logo { display: block; width: 72px; height: 72px; }
  /* 标题反而可以收：品牌已经在上面那张图上，这里只是把名字念出来 */
  .boot-title {
    margin: -6px 0 0; font-size: 15px; font-weight: 600; letter-spacing: -.015em;
  }
  /* 加载动画：六段圆弧、圆头、无圆心，匀速快转（与 src/styles/base.css 的 .spinner 同一套参数）。
     dasharray 是按 r=9 的周长算的：每对 9.42（40° 弧 + 20° 缺口），
     弧段扣掉线宽（圆头会各外扩半个线宽）才留得住这道缺口。 */
  .boot-spin { width: 30px; height: 30px; animation: boot-spin .8s linear infinite; }
  .boot-spin > circle {
    fill: none; stroke: #0f7b8a; stroke-width: 2.6; stroke-linecap: round;
    stroke-dasharray: 3.68 5.74 3.68 5.74 3.68 5.74 3.68 5.74 3.68 5.74 3.68 5.74;
  }
  @keyframes boot-spin { to { transform: rotate(360deg); } }
  .boot-hint { margin: 0; max-width: 42ch; text-align: center; font-size: 12.5px; color: #5b6469; }
  .boot-hint code {
    font-family: "Cascadia Mono", Consolas, monospace; font-size: 11.5px;
    background: rgba(13, 32, 38, .06); padding: 1px 5px; border-radius: 6px;
  }
  .boot-noscript { margin: 0; max-width: 46ch; text-align: center; font-size: 13px; line-height: 1.7; }
  @media (prefers-color-scheme: dark) {
    body { background: #1a1e20; color: #f1f5f6; }
    .boot-spin > circle { stroke: #4fb6c4; }   /* 深底上把强调色提亮一档，弧段才看得清 */
    .boot-hint { color: #b6c1c4; }
    .boot-hint code { background: rgba(255, 255, 255, .08); }
  }
  /* 减少动效：不转，但六段弧的形状留着（清空 dasharray 会变回一个整圈，反而看不出是"在载入"） */
  @media (prefers-reduced-motion: reduce) { .boot-spin { animation: none; } }
</style>
</head>
<body>
<div id="app">
  <div class="boot">
    <img class="boot-logo" src="/cylit/icon.png" alt="" width="72" height="72" />
    <p class="boot-title">Cylit</p>
    <svg class="boot-spin" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <circle cx="12" cy="12" r="9" />
    </svg>
    <p class="boot-hint">正在载入工作区…</p>
  </div>
  <noscript>
    <div class="boot">
      <p class="boot-noscript">
        Cylit 需要 JavaScript 才能运行。<br />
        请在这个浏览器里启用脚本后刷新一次。
      </p>
    </div>
  </noscript>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
