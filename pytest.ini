[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -q --strict-markers
markers =
    e2e: 端到端测试（需要真实 PDF）
    online: MinerU 在线解析（默认跳过；用 `pytest --run-online` 跑，且不联网）
    mineru_live: 需要真实 MinerU token 的联网冒烟（在 online 之上再跳过）
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
